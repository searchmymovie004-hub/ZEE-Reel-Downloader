<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NEXORA Admin Login</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body class="admin-page"><main class="admin-shell"><img class="admin-logo" src="{{ url_for('static', filename='nexora-logo.png') }}" alt="NEXORA DOWNLOADER"><h1>NEXORA Admin</h1><p>Protected settings dashboard</p>{% if error %}<div class="admin-error">{{ error }}</div>{% endif %}<form method="post" class="admin-form"><label>Username<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="primary-button" type="submit">Sign in <span>→</span></button></form><a class="admin-back" href="{{ url_for('index') }}">← Back to website</a></main></body></html>
