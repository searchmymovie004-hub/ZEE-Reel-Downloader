services:
  - type: web
    name: zee-reel-downloader
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: FILE_TTL_SECONDS
        value: "1800"
      - key: RATE_LIMIT_COUNT
        value: "5"
      - key: RATE_LIMIT_WINDOW
        value: "600"
      - key: MAX_DOWNLOAD_BYTES
        value: "157286400"
      - key: LOG_LEVEL
        value: INFO
